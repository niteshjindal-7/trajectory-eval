[project]
name = "trajectory-eval"
version = "0.1.0"
description = "PhD Research PoC: Trajectory Evaluation for Multi-Step LLM Agents in Healthcare Domain"
authors = [{name = "Nitesh Jindal"}]
requires-python = ">=3.10"

dependencies = [
    # LangGraph agent framework
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    # Observability
    "langfuse>=2.0.0",
    # HTTP calls (OpenFDA + CMS APIs)
    "requests>=2.31.0",
    "httpx>=0.27.0",
    # Config and validation
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
